<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Pi symbol icon - teal on transparent background -->
  <!-- Rounded square background with teal gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00897b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00695c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="piGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Pi (π) symbol - clean geometric design -->
  <!-- Top horizontal bar of Pi -->
  <rect x="120" y="120" width="272" height="36" rx="18" fill="url(#piGrad)"/>
  <!-- Left vertical leg -->
  <path d="M 156 156 L 156 380 Q 156 400 136 400 Q 116 400 116 380 L 116 156 Z" fill="url(#piGrad)"/>
  <!-- Right vertical leg -->
  <path d="M 356 156 L 356 380 Q 356 400 336 400 Q 316 400 316 380 L 316 156 Z" fill="url(#piGrad)"/>
  <!-- Middle serif/connector left -->
  <rect x="120" y="120" width="36" height="48" rx="4" fill="url(#piGrad)"/>
  <!-- Middle serif/connector right -->
  <rect x="356" y="120" width="36" height="48" rx="4" fill="url(#piGrad)"/>
</svg>
