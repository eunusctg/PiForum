<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00897b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00bcd4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Circuit pattern background circle -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.3"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#grad1)" stroke-width="1.5" opacity="0.2"/>
  <!-- Circuit lines -->
  <line x1="120" y1="256" x2="180" y2="256" stroke="url(#grad1)" stroke-width="2" opacity="0.4"/>
  <line x1="332" y1="256" x2="392" y2="256" stroke="url(#grad1)" stroke-width="2" opacity="0.4"/>
  <line x1="256" y1="120" x2="256" y2="170" stroke="url(#grad1)" stroke-width="2" opacity="0.4"/>
  <line x1="256" y1="342" x2="256" y2="392" stroke="url(#grad1)" stroke-width="2" opacity="0.4"/>
  <!-- Circuit nodes -->
  <circle cx="110" cy="256" r="4" fill="#00bcd4" opacity="0.5"/>
  <circle cx="402" cy="256" r="4" fill="#00bcd4" opacity="0.5"/>
  <circle cx="256" cy="110" r="4" fill="#00bcd4" opacity="0.5"/>
  <circle cx="256" cy="402" r="4" fill="#00bcd4" opacity="0.5"/>
  <!-- Diagonal circuit lines -->
  <line x1="150" y1="150" x2="195" y2="195" stroke="url(#grad1)" stroke-width="1.5" opacity="0.3"/>
  <line x1="317" y1="317" x2="362" y2="362" stroke="url(#grad1)" stroke-width="1.5" opacity="0.3"/>
  <line x1="362" y1="150" x2="317" y2="195" stroke="url(#grad1)" stroke-width="1.5" opacity="0.3"/>
  <line x1="195" y1="317" x2="150" y2="362" stroke="url(#grad1)" stroke-width="1.5" opacity="0.3"/>
  <!-- Pi Symbol - main character -->
  <text x="256" y="310" font-family="'Georgia', 'Times New Roman', serif" font-size="260" font-weight="bold" fill="url(#grad1)" text-anchor="middle" filter="url(#glow)">π</text>
  <!-- Subtle tech dots around pi -->
  <circle cx="170" cy="190" r="2" fill="#00bcd4" opacity="0.6"/>
  <circle cx="342" cy="190" r="2" fill="#00bcd4" opacity="0.6"/>
  <circle cx="170" cy="340" r="2" fill="#00bcd4" opacity="0.6"/>
  <circle cx="342" cy="340" r="2" fill="#00bcd4" opacity="0.6"/>
</svg>
