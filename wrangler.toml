# ============================================================
# PiForum — Cloudflare Workers (OpenNext) Configuration
# ============================================================
# ✅ All resources configured:
#    - D1 database:    piforum (25923490-eba7-4e98-b9f0-34c9c183c0b9)
#    - R2 bucket:      piforum-uploads
#    - KV namespace:   piforum-sessions (c36268abac2d4fe3bd426a92a060e2fb)
#    - Account:        Techctg24 Inc (704489378006d2bed6a45de180f6679f)
#    - Custom domains: piforum.eu.org, piforum.eu.cc
# ============================================================

name = "piforum"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Use OpenNext for Cloudflare (deploys as Worker, supports more Node.js APIs than Pages)
main = ".open-next/worker.js"
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# Minify the worker to reduce bundle size (critical for 3 MiB free plan limit)
minify = true

# ============================================================
# Account ID (Techctg24 Inc)
# ============================================================
account_id = "704489378006d2bed6a45de180f6679f"

# ============================================================
# D1 Database binding (✅ 'piforum' database created)
# ============================================================
[[d1_databases]]
binding = "DB"
database_name = "piforum"
database_id = "25923490-eba7-4e98-b9f0-34c9c183c0b9"

# ============================================================
# R2 Storage binding (✅ bucket 'piforum-uploads' already created)
# ============================================================
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "piforum-uploads"

# ============================================================
# KV Namespace binding (✅ 'piforum-sessions' already created)
# ============================================================
[[kv_namespaces]]
binding = "SESSIONS"
id = "c36268abac2d4fe3bd426a92a060e2fb"

# ============================================================
# Environment variables (non-secret)
# ============================================================
[vars]
NEXT_PUBLIC_SITE_URL = "https://piforum.eu.org"
NEXT_PUBLIC_SITE_NAME = "PiForum"
NEXTAUTH_URL = "https://piforum.eu.org"

# ============================================================
# Cloudflare Send Email binding
# Allows Workers to send outbound emails natively.
# Destination addresses must be verified in the CF dashboard
# OR the domain must have Email Routing enabled.
# Fallback: MailChannels API is used when this binding is
# unavailable or unverified.
# ============================================================
[[send_email]]
name = "SEND_EMAIL"
destination_address = "eunus527@gmail.com"

# Secrets to set via `wrangler secret put NAME`:
#   NEXTAUTH_SECRET          (generate: openssl rand -base64 32)
#   ZAI_API_KEY
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
#   WHATSAPP_TOKEN / WHATSAPP_PHONE_NUMBER_ID / WHATSAPP_VERIFY_TOKEN
#   TELEGRAM_BOT_TOKEN


# ============================================================
# Observability
# ============================================================
[observability]
enabled = false

# ============================================================
# Routes (custom domains)
# NOTE: Custom domains are configured via Cloudflare dashboard instead of
# wrangler.toml because the API token lacks Zone → Workers Routes → Edit
# permission. To add custom domains:
#   1. Go to https://dash.cloudflare.com → Workers & Pages → piforum
#   2. Settings → Domains & Routes → Add Custom Domain
#   3. Add "piforum.eu.org" and "piforum.eu.cc"
# ============================================================
# [[routes]]
# pattern = "piforum.eu.org"
# custom_domain = true
#
# [[routes]]
# pattern = "piforum.eu.cc"
# custom_domain = true
